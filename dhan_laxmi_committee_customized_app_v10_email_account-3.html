<script>
const KEY='dlc_custom_v3';
const defaults={settings:{name:'DHAN LAXMI COMMITTEE',tag:'साथ मिलकर, समृद्धि की ओर',interest:2,late:0,admin:'admin',pass:'1234',depPrefix:'DEP',loanPrefix:'LOAN',repayPrefix:'RET'},members:[],deposits:[],loans:[],repayments:[]};
let db=load(), page='dashboard', reportMonth=new Date().toISOString().slice(0,7);
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return structuredClone(defaults);const x=JSON.parse(raw);const d=structuredClone(defaults);d.settings={...d.settings,...(x.settings||{})};for(const k of ['members','deposits','loans','repayments'])d[k]=Array.isArray(x[k])?x[k]:[];if(!d.settings.admin)d.settings.admin='admin';if(!d.settings.pass)d.settings.pass='1234';return d}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthOf(d){return (d||'').slice(0,7)}
function monthName(m){if(!m)return '';let [y,x]=m.split('-');return new Date(+y,+x-1,1).toLocaleDateString('hi-IN',{month:'long',year:'numeric'})}
function nextToken(prefix,list){let max=list.reduce((a,x)=>Math.max(a,Number(String(x.token||'').replace(/\D/g,''))||0),0);return prefix+'-'+String(max+1).padStart(4,'0')}
function memberName(id){return db.members.find(m=>m.id===id)?.name||'Unknown'}
function completedMonths(startDate,endDate){if(!startDate||!endDate)return 0;const start=new Date(startDate+'T00:00:00'),end=new Date(endDate+'T00:00:00');if(isNaN(start)||isNaN(end)||end<start)return 0;let months=(end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth());if(months===0)return 1;return Math.max(1,months+(end.getDate()>=start.getDate()?0:0))}
function loanState(loan,endDate=today()){
 const rate=Number(loan.rate??db.settings.interest)||0;
 const end=endDate instanceof Date?endDate.toISOString().slice(0,10):String(endDate);
 let repayments=db.repayments.filter(r=>r.loanId===loan.id && String(r.date)<=end).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 let principal=Number(loan.amount)||0, cursor=loan.date, unpaidInterest=0, interestPaid=0, principalPaid=0, months=0;
 for(const r of repayments){
   if(principal<=0) break;
   const until=String(r.date);
   const m=completedMonths(cursor,until);
   const periodInterest=principal*rate/100*m;
   unpaidInterest=Math.max(0,unpaidInterest+periodInterest);
   months+=m;
   const totalPayment=Math.max(0,Number(r.amount||0));
   const ip= r.interestPaid!=null ? Math.min(unpaidInterest,Number(r.interestPaid)||0) : Math.min(unpaidInterest,totalPayment);
   const pp= r.principalPaid!=null ? Math.min(principal,Number(r.principalPaid)||0) : Math.min(principal,Math.max(0,totalPayment-ip));
   unpaidInterest=Math.max(0,unpaidInterest-ip);
   principal=Math.max(0,principal-pp);
   interestPaid+=ip; principalPaid+=pp; cursor=until;
 }
 if(principal>0){
   const m=completedMonths(cursor,end); months+=m; unpaidInterest+=principal*rate/100*m;
 }
 return {months,interest:unpaidInterest,interestPaid,totalInterest:interestPaid+unpaidInterest,principal,rate,principalPaid};
}
function calcInterest(loan,endDate=today()){return loanState(loan,endDate)}
function loanOutstanding(l){return loanState(l).principal}
function loanAmountDue(l,date=today()){const c=loanState(l,date);return Math.max(0,c.principal+c.interest)}
function totalDeposits(m){return db.deposits.filter(x=>!m||monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount||0),0)}
function interestReceived(m){return db.repayments.filter(x=>!m||monthOf(x.date)===m).reduce((a,x)=>a+Number(x.interestPaid||0),0)}
function totalDepositsWithInterest(m){return totalDeposits(m)+interestReceived(m)}
function totalInterest(m){return db.loans.reduce((sum,l)=>{let end=m?new Date(+m.slice(0,4),+m.slice(5),0):new Date();let issue=new Date(l.date+'T00:00:00');if(issue>end)return sum;let endDate=m?`${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`:today();return sum+calcInterest(l,endDate).totalInterest},0)}
function nav(){let items=[['dashboard','Dashboard'],['members','Members'],['deposit','जमा राशि'],['loan','ऋण'],['repay','ऋण जमा'],['reports','Reports'],['settings','Settings']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;nav();render()}
function render(){document.getElementById('brandName').textContent=db.settings.name;document.getElementById('brandTag').textContent=db.settings.tag;document.getElementById('loginName').textContent=db.settings.name;let f={dashboard:dashboard,members:members,deposit:deposit,loan:loan,repay:repay,reports:reports,settings:settings}[page];document.getElementById('page').innerHTML=f()}
function dashboard(){let m=new Date().toISOString().slice(0,7), dep=totalDepositsWithInterest(m), all=totalDepositsWithInterest(), interest=totalInterest(m), allInt=totalInterest(), issued=db.loans.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount),0), outstanding=db.loans.reduce((a,x)=>a+loanOutstanding(x),0), returned=db.repayments.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount),0), late=db.deposits.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.late||0),0), cash=all+db.repayments.reduce((a,x)=>a+Number(x.amount),0)+allInt+db.deposits.reduce((a,x)=>a+Number(x.late||0),0)-db.loans.reduce((a,x)=>a+Number(x.amount),0);return `<div class="sectionhead"><div><h3>Dashboard</h3><div class="small">${monthName(m)}</div></div><div class="actions"><button class="btn gold" onclick="openDeposit()">+ जमा</button><button class="btn" onclick="openLoan()">+ ऋण</button></div></div><div class="grid"><div class="card stat"><div class="label">इस महीने जमा</div><div class="value">${money(dep)}</div></div><div class="card stat"><div class="label">सभी महीनों की कुल जमा</div><div class="value">${money(all)}</div></div><div class="card stat"><div class="label">इस महीने का ब्याज</div><div class="value">${money(interest)}</div></div><div class="card stat"><div class="label">सभी महीनों का कुल ब्याज</div><div class="value">${money(allInt)}</div></div><div class="card stat"><div class="label">इस महीने ऋण दिया</div><div class="value">${money(issued)}</div></div><div class="card stat"><div class="label">इस महीने ऋण जमा</div><div class="value">${money(returned)}</div></div><div class="card stat"><div class="label">कुल बकाया ऋण</div><div class="value">${money(outstanding)}</div></div><div class="card stat"><div class="label">TOTAL AMOUNT / Cash</div><div class="value">${money(cash)}</div></div></div><div class="card" style="margin-top:12px"><div class="sectionhead"><h3>Quick Summary</h3><button class="btn light" onclick="go('reports')">पूरा Report</button></div> function members(){return `<div class="sectionhead"><div><h3>Members</h3><div class="small">हर व्यक्ति का अलग account</div></div><button class="btn" onclick="openMember()">+ नाम Add करें</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>नाम</th><th>कुल जमा</th><th>कुल ऋण</th><th>ऋण बकाया</th><th>ऋण महीने</th><th>Action</th></tr></thead><tbody>${db.members.length?db.members.map((m,i)=>{let dep=db.deposits.filter(x=>x.memberId===m.id).reduce((a,x)=>a+Number(x.amount),0)+db.repayments.filter(x=>x.memberId===m.id).reduce((a,x)=>a+Number(x.interestPaid||0),0);let ls=db.loans.filter(x=>x.memberId===m.id), loan=ls.reduce((a,x)=>a+Number(x.amount),0), out=ls.reduce((a,x)=>a+loanOutstanding(x),0), months=ls.reduce((a,x)=>a+calcInterest(x).months,0);return `<tr><td>${i+1}</td><td><b>${esc(m.name)}</b><div class="small">${esc(m.phone||'')}</div></td><td>${money(dep)}</td><td>${money(loan)}</td><td>${money(out)}</td><td>${months}</td><td><div class="row-actions"><button class="btn light" onclick="memberHistory('${m.id}')">History</button><button class="btn light" onclick="openMember('${m.id}')">Edit</button><button class="btn danger" onclick="delMember('${m.id}')">Delete</button></div></td></tr>`}).join(''):`<tr><td colspan="7" class="empty">अभी कोई member नहीं है</td></tr>`}</tbody></table></div></div>`}
function deposit(){let m=reportMonth;return `<div class="sectionhead"><div><h3>जमा राशि</h3><div class="small">प्रत्येक महीने तारीख और token के साथ</div></div><div class="actions"><input type="month" value="${m}" onchange="reportMonth=this.value;render()"><button class="btn" onclick="openDeposit()">+ जमा Add</button></div></div><div class="grid"><div class="card stat"><div class="label">${monthName(m)} में जमा + ब्याज</div><div class="value">${money(totalDepositsWithInterest(m))}</div></div><div class="card stat"><div class="label">Total Deposit + ब्याज</div><div class="value">${money(totalDepositsWithInterest())}</div></div></div><div class="card" style="margin-top:12px"><div class="tablewrap"><table class="table"><thead><tr><th>Token</th><th>नाम</th><th>जमा राशि</th><th>तारीख</th><th>लेट चार्ज</th><th>Month</th><th>Action</th></tr></thead><tbody>${db.deposits.filter(x=>monthOf(x.date)===m).map(x=>`<tr><td><span class="pill">${esc(x.token)}</span></td><td>${esc(memberName(x.memberId))}</td><td>${money(x.amount)}</td><td>${x.date}</td><td>${money(x.late)}</td><td>${monthName(monthOf(x.date))}</td><td><div class="row-actions"><button class="btn light" onclick="printReceipt('deposit','${x.id}')">Print</button><button class="btn danger" onclick="delRec('deposits','${x.id}')">Delete</button></div></td></tr>`).join('')||`<tr><td colspan="7" class="empty">इस महीने कोई जमा नहीं</td></tr>`}</tbody></table></div></div>`}
function loan(){return `<div class="sectionhead"><div><h3>ऋण</h3><div class="small">हर चालू ऋण पर महीने के हिसाब से ब्याज अपने-आप निकलेगा</div></div><button class="btn" onclick="openLoan()">+ ऋण Add</button></div><div class="card notice">ब्याज = बकाया मूलधन × ब्याज % × ऋण के महीने। इस version में ऋण का जिस calendar month में रिकॉर्ड है, वह महीना ब्याज गणना में शामिल होगा। उदाहरण: ₹10,000 × 2% = ₹200 प्रति महीना।</div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Token</th><th>नाम</th><th>ऋण राशि</th><th>ऋण तारीख</th><th>ब्याज %</th><th>महीने</th><th>कुल ब्याज</th><th>मूलधन बकाया</th><th>Action</th></tr></thead><tbody>${db.loans.map(x=>{let c=calcInterest(x);return `<tr><td><span class="pill">${esc(x.token)}</span></td><td>${esc(memberName(x.memberId))}</td><td>${money(x.amount)}</td><td>${x.date}</td><td>${c.rate}%</td><td>${c.months}</td><td><b>${money(c.interest)}</b></td><td>${money(c.principal)}</td><td><div class="row-actions"><button class="btn gold" onclick="openRepay('${x.id}')">ऋण जमा</button><button class="btn light" onclick="printReceipt('loan','${x.id}')">Print</button><button class="btn danger" onclick="delRec('loans','${x.id}')">Delete</button></div></td></tr>`}).join('')||`<tr><td colspan="9" class="empty">अभी कोई ऋण रिकॉर्ड नहीं</td></tr>`}</tbody></table></div></div>`}
function repay(){return `<div class="sectionhead"><div><h3>ऋण जमा / Return</h3><div class="small">ऋण वापस करने की तारीख और token दोनों रहेंगे</div></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Token</th><th>नाम</th><th>Loan Token</th><th>जमा राशि</th><th>ब्याज</th><th>मूलधन</th><th>जमा तारीख</th><th>Action</th></tr></thead><tbody>${db.repayments.map(x=>`<tr><td><span class="pill">${esc(x.token)}</span></td><td>${esc(memberName(x.memberId))}</td><td>${esc(db.loans.find(l=>l.id===x.loanId)?.token||'')}</td><td>${money(x.amount)}</td><td>${money(x.interestPaid||0)}</td><td>${money(x.principalPaid??x.amount)}</td><td>${x.date}</td><td><div class="row-actions"><button class="btn light" onclick="printReceipt('repay','${x.id}')">Print</button><button class="btn danger" onclick="delRec('repayments','${x.id}')">Delete</button></div></td></tr>`).join('')||`<tr><td colspan="8" class="empty">अभी कोई ऋण जमा रिकॉर्ड नहीं</td></tr>`}</tbody></table></div></div>`}
function reports(){let m=reportMonth, dep=totalDeposits(m), ret=db.repayments.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount),0), issued=db.loans.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount),0), late=db.deposits.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.late||0),0), interest=totalInterest(m), allDep=totalDeposits(), allInt=totalInterest(), allRet=db.repayments.reduce((a,x)=>a+Number(x.amount),0), allIssued=db.loans.reduce((a,x)=>a+Number(x.amount),0), allLate=db.deposits.reduce((a,x)=>a+Number(x.late||0),0), cash=allDep+allRet+allInt+allLate-allIssued;return `<div class="sectionhead"><div><h3>Reports</h3><div class="small">Monthly-wise और all-time report</div></div><div class="actions"><input type="month" value="${m}" onchange="reportMonth=this.value;render()"><button class="btn light" onclick="exportCSV()">Excel/CSV Export</button><button class="btn" onclick="printReport()">Print Report</button></div></div><div class="reportgrid"><div class="card"><h3>${monthName(m)}</h3><div class="kpi">इस महीने कुल जमा<br><b>${money(dep)}</b></div><div class="kpi">इस महीने कुल ब्याज<br><b>${money(interest)}</b></div><div class="kpi">इस महीने ऋण दिया<br><b>${money(issued)}</b></div><div class="kpi">इस महीने ऋण जमा<br><b>${money(ret)}</b></div><div class="kpi">इस महीने लेट चार्ज<br><b>${money(late)}</b></div></div><div class="card"><h3>सभी महीने</h3><div class="kpi">कुल जमा<br><b>${money(allDep)}</b></div><div class="kpi">कुल ब्याज<br><b>${money(allInt)}</b></div><div class="kpi">कुल ऋण दिया<br><b>${money(allIssued)}</b></div><div class="kpi">कुल ऋण जमा<br><b>${money(allRet)}</b></div><div class="kpi">कुल लेट चार्ज<br><b>${money(allLate)}</b></div><div class="kpi">TOTAL AMOUNT / Cash<br><b>${money(cash)}</b></div></div></div><div class="card" style="margin-top:12px"><div class="sectionhead"><h3>किस व्यक्ति का कितने महीने ऋण</h3></div><div class="tablewrap"><table class="table"><thead><tr><th>नाम</th><th>ऋण कुल</th><th>कुल जमा/Return</th><th>बकाया</th><th>ऋण महीने</th><th>अनुमानित ब्याज</th></tr></thead><tbody>${db.members.map(mem=>{let ls=db.loans.filter(x=>x.memberId===mem.id), issued=ls.reduce((a,x)=>a+Number(x.amount),0), out=ls.reduce((a,x)=>a+loanOutstanding(x),0), months=ls.reduce((a,x)=>a+calcInterest(x).months,0), intr=ls.reduce((a,x)=>a+calcInterest(x).interest,0);let rt=db.repayments.filter(x=>x.memberId===mem.id).reduce((a,x)=>a+Number(x.amount),0);return `<tr><td>${esc(mem.name)}</td><td>${money(issued)}</td><td>${money(rt)}</td><td>${money(out)}</td><td>${months}</td><td>${money(intr)}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">No data</td></tr>`}</tbody></table></div></div>`}
function settings(){return `<div class="sectionhead"><div><h3>Settings / Customise</h3><div class="small">App के नाम, ब्याज, लेट चार्ज, token और login को बदलें</div></div></div><div class="card"><div class="formgrid"><div class="field"><label>Committee Name</label><input id="sname" value="${esc(db.settings.name)}"></div><div class="field"><label>Tagline</label><input id="stag" value="${esc(db.settings.tag)}"></div><div class="field"><label>ब्याज प्रतिशत %</label><input id="sint" type="number" step="0.01" value="${db.settings.interest}"></div><div class="field"><label>Default Late Charge</label><input id="slate" type="number" value="${db.settings.late}"></div><div class="field"><label>Deposit Token Prefix</label><input id="sdep" value="${esc(db.settings.depPrefix)}"></div><div class="field"><label>Loan Token Prefix</label><input id="sloan" value="${esc(db.settings.loanPrefix)}"></div><div class="field"><label>Return Token Prefix</label><input id="sret" value="${esc(db.settings.repayPrefix)}"></div></div><button class="btn" onclick="saveSettings()">Save Customisation</button></div><div class="card" style="margin-top:12px"><h3>Backup / Restore</h3><div class="actions"><button class="btn light" onclick="backup()">Backup JSON</button><label class="btn light">Restore JSON<input type="file" accept="application/json" hidden onchange="restore(event)"></label><button class="btn danger" onclick="resetData()">Reset All Data</button></div></div>`}
function openModal(title,body){document.getElementById('modalBox').innerHTML=`<div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function memberOptions(selected=''){return db.members.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${esc(m.name)}</option>`).join('')}
function openMember(id=''){let m=db.members.find(x=>x.id===id)||{};openModal(id?'Member Edit':'नाम Add',`<div class="formgrid"><div class="field"><label>नाम *</label><input id="mname" value="${esc(m.name||'')}"></div><div class="field"><label>Mobile</label><input id="mphone" value="${esc(m.phone||'')}"></div><div class="field"><label>Address</label><input id="maddr" value="${esc(m.address||'')}"></div></div><button class="btn" onclick="saveMember('${id}')">Save</button>`)}
function saveMember(id){let name=document.getElementById('mname').value.trim();if(!name)return alert('नाम डालें');let obj={id:id||crypto.randomUUID(),name,phone:document.getElementById('mphone').value,address:document.getElementById('maddr').value};if(id){let i=db.members.findIndex(x=>x.id===id);db.members[i]=obj}else db.members.push(obj);save();closeModal();render()}
function delMember(id){if(!confirm('Member और उसके records delete होंगे. जारी रखें?'))return;db.members=db.members.filter(x=>x.id!==id);db.deposits=db.deposits.filter(x=>x.memberId!==id);db.loans=db.loans.filter(x=>x.memberId!==id);db.repayments=db.repayments.filter(x=>x.memberId!==id);save();render()}
function openDeposit(){openModal('जमा राशि Add',`<div class="formgrid"><div class="field"><label>Member *</label><select id="dmem">${memberOptions()}</select></div><div class="field"><label>जमा राशि ₹ *</label><input id="damt" type="number" step="0.01"></div><div class="field"><label>जमा तारीख *</label><input id="ddate" type="date" value="${today()}"></div><div class="field"><label>Late Charge ₹</label><input id="dlate" type="number" value="${db.settings.late}"></div></div><div class="notice">Token automatic बनेगा: ${db.settings.depPrefix}-0001 जैसा</div><button class="btn" onclick="saveDeposit()">जमा Save करें</button>`)}
function saveDeposit(){let memberId=document.getElementById('dmem').value,amount=Number(document.getElementById('damt').value),date=document.getElementById('ddate').value;if(!memberId||!amount||!date)return alert('Member, राशि और तारीख भरें');let x={id:crypto.randomUUID(),token:nextToken(db.settings.depPrefix,db.deposits),memberId,amount,date,late:Number(document.getElementById('dlate').value||0)};db.deposits.push(x);save();closeModal();render();printReceipt('deposit',x.id)}
function openLoan(){if(!db.members.length)return alert('पहले Member add करें');openModal('ऋण Add',`<div class="formgrid"><div class="field"><label>Member *</label><select id="lmem">${memberOptions()}</select></div><div class="field"><label>ऋण राशि ₹ *</label><input id="lamt" type="number" step="0.01"></div><div class="field"><label>ऋण तारीख *</label><input id="ldate" type="date" value="${today()}"></div><div class="field"><label>ब्याज %</label><input id="lrate" type="number" step="0.01" value="${db.settings.interest}"></div><div class="field"><label>Expected महीना</label><input id="lmonths" type="number" min="0" value="0"></div></div><div class="notice">ब्याज मासिक आधार पर calculate होगा। 2% का मतलब हर पूरे महीने के लिए बकाया मूलधन का 2%। ऋण वापसी होने पर आगे का ब्याज बची हुई मूलधन राशि पर calculate होगा। Loan token automatic बनेगा।</div><button class="btn" onclick="saveLoan()">ऋण Save करें</button>`)}
function saveLoan(){let memberId=document.getElementById('lmem').value,amount=Number(document.getElementById('lamt').value),date=document.getElementById('ldate').value;if(!memberId||!amount||!date)return alert('Member, राशि और तारीख भरें');let x={id:crypto.randomUUID(),token:nextToken(db.settings.loanPrefix,db.loans),memberId,amount,date,rate:Number(document.getElementById('lrate').value||db.settings.interest),expectedMonths:Number(document.getElementById('lmonths').value||0)};db.loans.push(x);save();closeModal();render();printReceipt('loan',x.id)}
function openRepay(loanId){let l=db.loans.find(x=>x.id===loanId);if(!l)return;let due=loanAmountDue(l,today()), c=calcInterest(l);openModal('ऋण जमा / Return',`<div class="notice"><b>${esc(memberName(l.memberId))}</b> • Loan ${esc(l.token)}<br>बकाया मूलधन: ${money(c.principal)} • अब तक ब्याज: ${money(c.interest)}<br><b>आज पूरा ऋण + ब्याज: ${money(due)}</b></div><div class="formgrid"><div class="field"><label>जमा राशि ₹ *</label><input id="ramt" type="number" step="0.01" value="${due}"></div><div class="field"><label>ऋण जमा तारीख *</label><input id="rdate" type="date" value="${today()}"></div></div><div class="notice">भुगतान पहले बकाया ब्याज में जाएगा, फिर मूलधन में। पूरा भुगतान करने पर ऋण बंद हो जाएगा।</div><button class="btn" onclick="saveRepay('${loanId}')">ऋण + ब्याज जमा Save करें</button>`)}
function saveRepay(loanId){let l=db.loans.find(x=>x.id===loanId),amount=Number(document.getElementById('ramt').value),date=document.getElementById('rdate').value;if(!amount||!date)return alert('राशि और तारीख भरें');let c=calcInterest(l,date),due=c.principal+c.interest;if(amount>due+0.005)return alert('राशि कुल बकाया (मूलधन + ब्याज) से अधिक है');let interestPaid=Math.min(c.interest,amount),principalPaid=Math.min(c.principal,Math.max(0,amount-interestPaid));let x={id:crypto.randomUUID(),token:nextToken(db.settings.repayPrefix,db.repayments),loanId,memberId:l.memberId,amount,interestPaid,principalPaid,date};db.repayments.push(x);save();closeModal();render();printReceipt('repay',x.id)}
function delRec(arr,id){if(!confirm('Delete करें?'))return;db[arr]=db[arr].filter(x=>x.id!==id);save();render()}
function memberHistory(id){let m=db.members.find(x=>x.id===id);let deps=db.deposits.filter(x=>x.memberId===id), ls=db.loans.filter(x=>x.memberId===id), rs=db.repayments.filter(x=>x.memberId===id);openModal('Member History — '+esc(m.name),`<div class="grid"><div class="card stat"><div class="label">कुल जमा + ब्याज</div><div class="value">${money(deps.reduce((a,x)=>a+Number(x.amount),0)+rs.reduce((a,x)=>a+Number(x.interestPaid||0),0))}</div></div><div class="card stat"><div class="label">कुल ऋण</div><div class="value">${money(ls.reduce((a,x)=>a+Number(x.amount),0))}</div></div><div class="card stat"><div class="label">ऋण जमा</div><div class="value">${money(rs.reduce((a,x)=>a+Number(x.amount),0))}</div></div><div class="card stat"><div class="label">बकाया</div><div class="value">${money(ls.reduce((a,x)=>a+loanOutstanding(x),0))}</div></div></div><h4>Monthly Deposit</h4><div class="tablewrap"><table class="table"><tr><th>Token</th><th>राशि</th><th>तारीख</th><th>Late</th></tr>${deps.map(x=>`<tr><td>${x.token}</td><td>${money(x.amount)}</td><td>${x.date}</td><td>${money(x.late)}</td></tr>`).join('')}</table></div><h4>Loans</h4><div class="tablewrap"><table class="table"><tr><th>Token</th><th>राशि</th><th>तारीख</th><th>Rate</th><th>महीने</th><th>ब्याज</th><th>बकाया</th></tr>${ls.map(x=>{let c=calcInterest(x);return `<tr><td>${x.token}</td><td>${money(x.amount)}</td><td>${x.date}</td><td>${x.rate}%</td><td>${c.months}</td><td>${money(c.interest)}</td><td>${money(c.principal)}</td></tr>`}).join('')}</table></div>`)}
function printReceipt(type,id){let title='',rows=[];if(type==='deposit'){let x=db.deposits.find(a=>a.id===id);title='जमा राशि Receipt';rows=[['Token Number',x.token],['Member',memberName(x.memberId)],['जमा राशि',money(x.amount)],['जमा तारीख',x.date],['Late Charge',money(x.late)]]}if(type==='loan'){let x=db.loans.find(a=>a.id===id);title='ऋण Receipt';let c=calcInterest(x);rows=[['Token Number',x.token],['Member',memberName(x.memberId)],['ऋण राशि',money(x.amount)],['ऋण तारीख',x.date],['ब्याज प्रतिशत',x.rate+'%'],['अब तक के पूरे महीने',c.months],['अब तक का ब्याज',money(c.interest)],['बकाया मूलधन',money(c.principal)],['Expected महीना',x.expectedMonths]]}if(type==='repay'){let x=db.repayments.find(a=>a.id===id);title='ऋण जमा Receipt';rows=[['Token Number',x.token],['Member',memberName(x.memberId)],['Loan Token',db.loans.find(l=>l.id===x.loanId)?.token||''],['जमा राशि',money(x.amount)],['ऋण जमा तारीख',x.date],['भुगतान किया ब्याज',money(x.interestPaid||0)],['भुगतान मूलधन',money(x.principalPaid??x.amount)]]}document.getElementById('printArea').innerHTML=`<div class="printreceipt"><h1>${esc(db.settings.name)}</h1><h2 style="text-align:center">${title}</h2><div class="line"></div><table>${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table><div class="line"></div><p>Generated: ${new Date().toLocaleString('hi-IN')}</p><p style="text-align:center">धन्यवाद</p></div>`;window.print()}
function printReport(){let m=reportMonth;document.getElementById('printArea').innerHTML=`<div class="printreceipt"><h1>${esc(db.settings.name)}</h1><h2>${monthName(m)} Report</h2><table>${[['इस महीने जमा + प्राप्त ब्याज',money(totalDepositsWithInterest(m))],['इस महीने कुल ब्याज',money(totalInterest(m))],['इस महीने प्राप्त ब्याज',money(interestReceived(m))],['इस महीने ऋण दिया',money(db.loans.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount),0))],['इस महीने ऋण जमा',money(db.repayments.filter(x=>monthOf(x.date)===m).reduce((a,x)=>a+Number(x.amount),0))],['कुल जमा + प्राप्त ब्याज',money(totalDepositsWithInterest())],['सभी महीनों का कुल ब्याज',money(totalInterest())],['सभी महीनों में प्राप्त ब्याज',money(interestReceived())]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`;window.print()}
function exportCSV(){let lines=[['Type','Token','Member','Amount','Date','Month','InterestRate','LateCharge','LoanToken']];db.deposits.forEach(x=>lines.push(['Deposit',x.token,memberName(x.memberId),x.amount,x.date,monthOf(x.date),'',x.late,'']));db.loans.forEach(x=>lines.push(['Loan',x.token,memberName(x.memberId),x.amount,x.date,monthOf(x.date),x.rate,'','']));db.repayments.forEach(x=>lines.push(['Loan Return',x.token,memberName(x.memberId),x.amount,x.date,monthOf(x.date),'','',db.loans.find(l=>l.id===x.loanId)?.token||'']));let csv=lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('dhan_laxmi_records.csv','text/csv;charset=utf-8',csv)}
function download(name,type,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){download('dhan_laxmi_backup.json','application/json',JSON.stringify(db,null,2))}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert('Restore सफल')}catch(x){alert('Invalid backup')}};r.readAsText(f)}
function saveSettings(){db.settings.name=document.getElementById('sname').value.trim()||db.settings.name;db.settings.tag=document.getElementById('stag').value;db.settings.interest=Number(document.getElementById('sint').value||2);db.settings.late=Number(document.getElementById('slate').value||0);db.settings.depPrefix=document.getElementById('sdep').value||'DEP';db.settings.loanPrefix=document.getElementById('sloan').value||'LOAN';db.settings.repayPrefix=document.getElementById('sret').value||'RET';save();render();alert('Customisation save हो गया')}
function resetData(){if(confirm('सारा app data delete होगा. क्या आप sure हैं?')){db=structuredClone(defaults);save();render()}}
const AUTH_KEY='dlc_accounts_v1';
function getAccounts(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'[]')}catch(e){return []}}
function saveAccounts(a){localStorage.setItem(AUTH_KEY,JSON.stringify(a))}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
function showCreateAccount(){document.getElementById('loginTab').style.display='none';document.getElementById('createTab').style.display='block';document.getElementById('authErr').textContent=''}
function showLoginAccount(){document.getElementById('createTab').style.display='none';document.getElementById('loginTab').style.display='block';document.getElementById('authErr').textContent=''}
function createAccount(){
  const name=String(document.getElementById('regName').value||'').trim();
  const email=String(document.getElementById('regEmail').value||'').trim().toLowerCase();
  const pass=String(document.getElementById('regPass').value||'');
  const pass2=String(document.getElementById('regPass2').value||'');
  const err=document.getElementById('authErr');
  if(!name){err.textContent='Name दर्ज करें';return}
  if(!validEmail(email)){err.textContent='सही Email ID दर्ज करें';return}
  if(pass.length<6){err.textContent='Password कम से कम 6 characters का रखें';return}
  if(pass!==pass2){err.textContent='दोनों Password समान नहीं हैं';return}
  const a=getAccounts();
  if(a.some(x=>x.email===email)){err.textContent='इस Email ID से account पहले से बना है';return}
  a.push({id:'u_'+Date.now(),name,email,password:pass,createdAt:new Date().toISOString()});
  saveAccounts(a);
  document.getElementById('emailLogin').value=email;
  document.getElementById('passLogin').value=pass;
  showLoginAccount();
  err.textContent='Account बन गया है। अब Login करें।';
}
function emailLogin(){
  const email=String(document.getElementById('emailLogin').value||'').trim().toLowerCase();
  const pass=String(document.getElementById('passLogin').value||'');
  const err=document.getElementById('authErr');
  const a=getAccounts();
  const u=a.find(x=>x.email===email&&x.password===pass);
  if(!u){err.textContent='Email ID या Password गलत है। पहले Create Account करें।';return}
  try{sessionStorage.setItem('dlc_auth',JSON.stringify({id:u.id,email:u.email,name:u.name}))}catch(e){}
  document.getElementById('authErr').textContent='';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  nav();render();
}
function logout(){try{sessionStorage.removeItem('dlc_auth')}catch(e){};document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('passLogin').value='';showLoginAccount()}
function resetLogin(){showLoginAccount()}
(function initAuth(){
  try{
    const raw=sessionStorage.getItem('dlc_auth');
    if(raw){const u=JSON.parse(raw); if(getAccounts().some(x=>x.id===u.id)){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');nav();render();return;}}
  }catch(e){}
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
})();
</script></body></html>
